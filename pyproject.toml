[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tlbench"
version = "1.0.0"
description = "Tenant isolation benchmark: deliberately vulnerable multi-tenant targets (REST, GraphQL, Supabase, MCP, RAG) and an answer key."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "graphql-core>=3.2"]

[project.scripts]
tlbench = "tlbench.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tlbench"]
